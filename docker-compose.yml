###
# THREDDS Data Server (TDS)
#
# Configuration lives in ./tomcat/content/thredds, which is bind-mounted over
# the image's content root. That mount is authoritative: catalog.xml,
# threddsConfig.xml, wmsConfig.xml and public/ are all read from the repo, so
# a `docker compose restart` is enough to pick up catalog changes.
#
# Files under ./files are only used when building the local Dockerfile; the
# running service uses the upstream image below.
#
# HTTPS is not served directly. The image ships no SSL connector, so put a
# reverse proxy in front of port 80 to terminate TLS.
###

services:
  thredds-production:
    image: unidata/thredds-docker:5.8
    container_name: thredds
    ports:
      - "80:8080"
    volumes:
      - ./tomcat/logs/:/usr/local/tomcat/logs/
      - ./files/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./tomcat/content/thredds/:/usr/local/tomcat/content/thredds/
      # Site logos referenced by <logoUrl> in threddsConfig.xml. Only certain
      # files in content/thredds/public are auto-served, and subdirectories are
      # not among them, so these are mounted into the webapp's static root and
      # served at /thredds/img/.
      - ./files/img/:/usr/local/tomcat/webapps/thredds/img/
      # Serve data from outside the repo by mounting it and pointing a
      # datasetScan/datasetRoot `location` at the container path:
      # - /path/to/your/data:/usr/local/tomcat/data/
    env_file:
      - "compose.env" # or "${THREDDS_COMPOSE_ENV_LOCAL}.env"
    restart: unless-stopped

  ###
  # TDM
  # Not strictly part of this repo, but useful to have around.
  # https://github.com/Unidata/tdm-docker
  #
  # The TDM builds indexes for GRIB featureCollections. This deployment serves
  # NetCDF via datasetScan, so it is not needed unless GRIB is added.
  ###
