version: '3'

services:
  # thredds-quickstart:
  #   image: unidata/thredds-docker:5.8
  #   ports:
  #     - "80:8080"
  #     - "443:8443"
  #     - "8443:8443"
  #   container_name: quickstart

  thredds-production:
    image: unidata/thredds-docker:5.8
    ports:
      - "80:8080"
      - "443:8443"
      - "8443:8443"
    container_name: thredds
    volumes:
      - /path/to/your/tomcat/logs/:/usr/local/tomcat/logs/
      - /path/to/your/thredds/logs/:/usr/local/tomcat/content/thredds/logs/
      - ~/thredds-docker/files/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ~/thredds-docker:/usr/local/tomcat/content/thredds
      - /path/to/your/data/directory1:/path/to/your/data/directory1
      - /path/to/your/data/directory2:/path/to/your/data/directory2
    env_file:
      - "compose.env" #"compose${THREDDS_COMPOSE_ENV_LOCAL}.env"

  ###
  # TDM
  # Not strictly part of this repo, but useful to have around
  # https://github.com/Unidata/tdm-docker
